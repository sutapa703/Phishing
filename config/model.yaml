model_selection:
  model:
    XGBClassifier:
      search_param_grid:
        max_depth: [3, 5]
        n_estimators: [50, 100]
    GaussianNB:
      search_param_grid:
        var_smoothing: [0.000000001, 0.01]
    LogisticRegression:
      search_param_grid:
        C: [0.1, 1.0, 10.0]
        solver: [lbfgs]
